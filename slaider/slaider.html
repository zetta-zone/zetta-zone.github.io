
			<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zetta Web3</title>
    <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@400;500;700;800;900&amp;family=JetBrains+Mono:wght@300;400;500&amp;display=swap" rel="stylesheet"/>
   
   <!-- Твои глобальные стили (переменные, фоны, карточки) -->
    <link rel="stylesheet" href="style.css"> 
<style>
body{
    margin:0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height:100vh;
    text-align: center;
    overflow: hidden;
}
.image-container{
    position:relative;
    width:200px;
    height:200px;
    transform-style: preserve-3d;
    transform: perspective(1000px) rotateY(0deg);
    transition: transform 0.7s;
}
.image-container span{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    transform: rotateY(calc(var(--i) * 45deg)) translateZ(400px);
}
.image-container span img{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    border-radius: 5px;
}

.btn-container{
    position:relative;
    width:80%;
}
.btn{
    position: absolute;
    bottom:-80px;
    background-color: orangered;
    color:white;
    padding:10px 20px;
    border-radius: 5px;
    border:none;
    cursor: pointer;
}
.btn:hover{
    filter:brightness(1.5);
}
#prev{
    left:20%;
}
#next{
    right:20%;
}
</style>
    <!-- Подключаем наши скрипты хедера и футера -->
    <script src="header.js" defer></script>
    <script src="footer.js" defer></script>
</head>

<body>



    <div class="image-container">
        <span style="--i: 1">
            <img src="https://bootstraptema.ru/snippets/slider/2024/rotating-3d/pic1.jpg" title="image">
        </span>
        <span style="--i: 2">
            <img src="https://bootstraptema.ru/snippets/slider/2024/rotating-3d/pic2.jpg" title="image">
        </span>
        <span style="--i: 3">
            <img src="https://bootstraptema.ru/snippets/slider/2024/rotating-3d/pic3.jpg" title="image">
        </span>
        <span style="--i: 4">
            <img src="https://bootstraptema.ru/snippets/slider/2024/rotating-3d/pic4.jpg" title="image">
        </span>
        <span style="--i: 5">
            <img src="https://bootstraptema.ru/snippets/slider/2024/rotating-3d/pic5.jpg" title="image">
        </span>
        <span style="--i: 6">
            <img src="https://bootstraptema.ru/snippets/slider/2024/rotating-3d/pic6.jpg" title="image">
        </span>
        <span style="--i: 7">
            <img src="https://bootstraptema.ru/snippets/slider/2024/rotating-3d/pic7.jpg" title="image">
        </span>
        <span style="--i: 8">
            <img src="https://bootstraptema.ru/snippets/slider/2024/rotating-3d/pic8.jpg" title="image">
        </span>
    </div>

    <div class="btn-container">
        <button class="btn" id="prev">Prev</button>
        <button class="btn" id="next">Next</button>
    </div>

<script>
const imageCon = document.querySelector(".image-container");

const prevEl = document.getElementById("prev");
const nextEl = document.getElementById("next");

let x=0;
let timer=0;

prevEl.addEventListener("click",()=>{
    x=x+45;
    clearTimeout(timer);
    updateImage();
});
nextEl.addEventListener("click",()=>{
    x=x-45;
    clearTimeout(timer);
    updateImage();
});

function updateImage(){
    imageCon.style.transform=`perspective(1000px) rotateY(${x}deg)`;
    timer=setTimeout(()=>{
        x=x-45;
        updateImage();
    },3000);
}
updateImage();
</script>
    </main>
    <!-- Футер подгрузится сюда сам -->
    <main-footer></main-footer>

    <!-- Кнопка возврата наверх (из нижнего куска на скрине) -->
    <button aria-label="Back to top" id="backToTop" title="Back to top">↑</button>
	<script src="ecard.js?v=3"></script>
<script id="autologo" src="autologo.js"></script>
</body>
</html>
