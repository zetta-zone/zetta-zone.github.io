<!doctype html><meta charset="utf-8"><title>V5 architecture smoke checks</title><style>body{font:14px system-ui;background:#102334;color:#eef}iframe{display:block;margin:8px 0;border:1px solid #456}pre{white-space:pre-wrap}</style>
<h1>V5: общие данные и оформление, отдельная геометрия</h1><pre id="report">Проверка…</pre><div id="frames"></div>
<script>
const q=new URLSearchParams(location.search),expected=q.get('name')||'RollerCoin NEW',color=q.get('color'),cases=[];
for(const view of ['cards','list','detail'])for(const [device,width]of [['desktop',1440],['tablet',768],['phone',390]]){const f=document.createElement('iframe');f.width=width;f.height=900;f.src='../'+(view==='detail'?'detail.html':'index.html')+'?'+new URLSearchParams({project:'rollercoin','ve-template-render':'1','ve-template':view,'ve-view':view,'ve-device':device});document.querySelector('#frames').append(f);cases.push({view,device,f})}
let attempts=0;function check(){const results=cases.map(({view,device,f})=>{const d=f.contentDocument,root=d?.querySelector('.dossier,#results>.project-item'),ready=root&&(d.querySelector('.ve-panel')||d.querySelector('#ve-status'));return {view,device,ready:!!ready,title:root?.querySelector('h1,.project-title')?.textContent.trim(),color:root?f.contentWindow.getComputedStyle(root).backgroundColor:null,width:root?.getBoundingClientRect().width,logo:root?.querySelector('.project-logo img')?.src,coin:root?.querySelector('[data-currency-group="coins"] .currency-item img')?.src,rating:root?.querySelector('.compact-ratings>div:first-child strong,.ratings [data-dialog="vote"] strong')?.textContent.trim()}});if(results.some(r=>!r.ready)&&attempts++<15){setTimeout(check,500);return}document.querySelector('#report').textContent=JSON.stringify({passed:results.every(r=>r.ready&&r.title===expected&&(!color||r.color===color)&&(!q.get('logo')||r.logo===q.get('logo'))&&(!q.get('coin')||r.coin===q.get('coin'))&&(!q.get('rating')||r.rating===q.get('rating'))),results},null,2)}setTimeout(check,1000);
</script>
