<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Генератор игровых карточек</title>
  <style>
    body { font-family: sans-serif; background-color: #0f111a; padding: 40px 20px; color: #f8f8f2; }
    .form-container { max-width: 600px; margin: 0 auto; background: #1a1c28; padding: 25px; border-radius: 12px; border: 1px solid #2a2d3d; }
    .row { display: flex; gap: 15px; margin-bottom: 15px; }
    .form-group { flex: 1; display: flex; flex-direction: column; margin-bottom: 15px; }
    label { font-size: 13px; color: #aeafb8; margin-bottom: 6px; font-weight: 600; }
    input, select { padding: 10px; border: 1px solid #2a2d3d; background: #11121a; color: #fff; border-radius: 6px; font-size: 14px; }
    .features-input input { margin-bottom: 6px; width: 96%; }
    button { background: #007bff; color: #fff; border: none; padding: 12px; font-size: 15px; font-weight: 600; border-radius: 6px; cursor: pointer; width: 100%; margin-bottom: 15px; }
    button:hover { background: #0056b3; }
    .result-box { margin-top: 25px; border-top: 1px solid #2a2d3d; padding-top: 20px; }
    textarea { width: 96%; background: #0b0c10; color: #a9ffb4; padding: 12px; height: 220px; border: 1px solid #2a2d3d; border-radius: 6px; font-family: monospace; font-size: 13px; }
    .copy-btn { background: #28a745; margin-top: 10px; }
  </style>
</head>
<body>

<div class="form-container">
  <h2>Добавление карточки проекта</h2>
  
  <div class="row">
    <div class="form-group">
      <label for="site-id">ID сайта</label>
      <input type="text" id="site-id" placeholder="firefaucet">
    </div>
    <div class="form-group">
      <label for="site-rank">Ранг (номер)</label>
      <input type="text" id="site-rank" placeholder="#01">
    </div>
  </div>

  <div class="row">
    <div class="form-group">
      <label for="site-name">Название проекта</label>
      <input type="text" id="site-name" placeholder="FireFaucet">
    </div>
    <div class="form-group">
      <label for="site-type">Подзаголовок / Тип</label>
      <input type="text" id="site-type" placeholder="Automatic HourlyFaucet">
    </div>
  </div>

  <div class="row">
    <div class="form-group">
      <label for="site-emoji">Аварийный Эмодзи</label>
      <input type="text" id="site-emoji" placeholder="💥">
    </div>
    <div class="form-group">
      <label for="crypto-ticker">Резервная монета</label>
      <select id="crypto-ticker">
        <option value="btc">Bitcoin (BTC)</option>
        <option value="ltc">Litecoin (LTC)</option>
        <option value="sol">Solana (SOL)</option>
        <option value="pol">Polygon (POL)</option>
        <option value="eth">Ethereum (ETH)</option>
        <option value="usdt">Tether (USDT)</option>
        <option value="trx">TRON (TRX)</option>
        <option value="doge">Dogecoin (DOGE)</option>
        <option value="bnb">BNB</option>
      </select>
    </div>
  </div>

  <div class="form-group">
    <label for="badge-type">Выбор баджа</label>
    <select id="badge-type">
      <option value="none">No badge</option>
      <option value="top" selected>★ TOP</option>
      <option value="new">🔥 NEW</option>
      <option value="hot">🔥 HOT</option>
    </select>
  </div>

  <div class="form-group">
    <label for="pill-text">Текст в плашке проверки</label>
    <input type="text" id="pill-text" placeholder="Earn crypto by completing tasks...">
  </div>

  <div class="form-group">
    <label>Преимущества (до 4 пунктов)</label>
    <div class="features-input">
      <input type="text" id="feat-1" placeholder="Пункт 1">
      <input type="text" id="feat-2" placeholder="Пункт 2">
      <input type="text" id="feat-3" placeholder="Пункт 3">
      <input type="text" id="feat-4" placeholder="Пункт 4">
    </div>
  </div>

  <div class="form-group">
    <label for="has-faucetpay">Поддержка FaucetPay?</label>
    <select id="has-faucetpay">
      <option value="no">No</option>
      <option value="yes">Yes</option>
    </select>
  </div>

  <div class="row">
    <div class="form-group">
      <label for="withdraw-badge">Куда вывод</label>
      <input type="text" id="withdraw-badge" value="Crypto">
    </div>
    <div class="form-group">
      <label for="btn-url">Реферальная ссылка</label>
      <input type="text" id="btn-url" placeholder="https://...">
    </div>
  </div>

  <div class="form-group">
    <label for="btn-text">Текст кнопки</label>
    <input type="text" id="btn-text" value="Start Auto Claim">
  </div>

  <!-- Кнопка генерации -->
  <button id="genBtn">Сгенерировать HTML</button>

  <!-- Блок с кодом ТЕПЕРЬ ВИДЕН ВСЕГДА -->
  <div class="result-box">
    <label>Готовый чистый код (появится здесь):</label>
    <textarea id="codeOutput" readonly placeholder="Заполните форму и нажмите кнопку выше..."></textarea>
    <button class="copy-btn" id="copyBtn">Скопировать код</button>
  </div>
</div>

<script>
// Назначаем события кнопкам напрямую без инлайн-атрибутов, чтобы CloudCannon не ругался
document.getElementById('genBtn').onclick = function() {
  const id = document.getElementById('site-id').value || 'site';
  const rank = document.getElementById('site-rank').value || '#01';
  const name = document.getElementById('site-name').value || 'Name';
  const type = document.getElementById('site-type').value || 'Description';
  const emoji = document.getElementById('site-emoji').value || '⭐';
  const ticker = document.getElementById('crypto-ticker').value;
  const badgeType = document.getElementById('badge-type').value;
  const pillText = document.getElementById('pill-text').value || '';
  const hasFaucetPay = document.getElementById('has-faucetpay').value === 'yes';
  const wBadge = document.getElementById('withdraw-badge').value || 'Crypto';
  const url = document.getElementById('btn-url').value || '#';
  const btnText = document.getElementById('btn-text').value || 'Get Started →';

  let featHtml = '';
  for(let i=1; i<=4; i++) {
    const val = document.getElementById('feat-'+i).value;
    if(val.trim() !== '') featHtml += '\t\t\t\t<div class="feat-item">' + val + '</div>\n';
  }
  if(featHtml) featHtml = '\t\t\t\t\t<div class="feat-list">\n' + featHtml + '\t\t\t\t\t</div>\n';

  let cardClass = "ecard", badgeHtml = "";
  if (badgeType === "top") { cardClass = "ecard top-pick featured"; badgeHtml = '\t\t\t<div class="top-badge">★ TOP</div>\n'; }
  else if (badgeType === "new") { cardClass = "ecard new-pick featured"; badgeHtml = '\t\t\t<div class="top-badge new-badge">🔥 NEW</div>\n'; }
  else if (badgeType === "hot") { cardClass = "ecard hot-pick featured"; badgeHtml = '\t\t\t<div class="top-badge hot-badge">🔥 HOT</div>\n'; }

  const pillHtml = pillText ? '\t\t\t\t<div class="feature-pill">\n\t\t\t\t\t\t<div class="fp-check">✓</div>\n\t\t\t\t\t\t<div class="fp-text">' + pillText + '</div>\n\t\t\t\t</div>\n' : '';
  const withdrawContent = hasFaucetPay ? '<a class="w-badge" data-btn="withdraw_faucetpay" data-site="' + id + '" data-track="click" href="https://faucetpay.io" rel="noopener" target="_blank">FaucetPay</a> <span class="w-badge">' + wBadge + '</span>' : '<span class="w-badge">' + wBadge + '</span>';

  let domain = '';
  try { domain = new URL(url).hostname.replace('www.', ''); } catch(e) {}
  const primaryDomainUrl = domain ? 'https://' + domain + '/favicon.ico' : 'https://github.io' + ticker + '.svg';

  const resultHtml = '<!-- ' + name + ' Begin -->\n' +
\t'<div class="' + cardClass + '" data-id="' + id + '" data-site="' + id + '">\n' +
\t\t'\t<div class="ecard-top-line"></div>\n' +
\t\t'\t<div class="ecard-head">\n' +
\t\t'\t\t<div class="ecard-icon"><img src="' + primaryDomainUrl + '" onerror="handleIconError(this, \'' + ticker + '\', \'' + emoji + '\')" alt="' + ticker + '" class="brand-logo" loading="lazy"/></div>\n' +
\t\t'\t\t<div class="ecard-meta">\n' +
\t\t'\t\t\t<div class="ecard-name">' + name + '</div>\n' +
\t\t'\t\t\t<div class="ecard-type">' + type + '</div>\n' +
\t\t'\t\t</div>\n' +
\t\t'\t\t\t<div class="ecard-rank">' + rank + '</div>\n' +
\t\t'\t</div>\n' +
badgeHtml + pillHtml + featHtml +
\t\t'\t\t\t\t<div class="withdraw-row">\n' +
\t\t'\t\t\t\t\t<span class="w-label">Withdraw to</span>\n' +
\t\t'\t\t\t\t\t' + withdrawContent + '\n' +
\t\t'\t\t\t\t</div>\n' +
\t\t'\t\t\t\t<div class="ecard-actions">\n' +
\t\t'\t\t\t\t\t<a class="btn btn-earn" data-btn="earn" data-site="' + id + '" data-track="click" href="' + url + '" rel="noopener" target="_blank">' + btnText + '</a>\n' +
\t\t'\t\t\t\t</div>\n' +
\t'</div>\n' +
'<!-- ' + name + ' End -->';

  document.getElementById('codeOutput').value = resultHtml;
};

document.getElementById('copyBtn').onclick = function() {
  const copyText = document.getElementById('codeOutput');
  copyText.select();
  document.execCommand('copy');
  alert('Код успешно скопирован в буфер обмена!');
};
</script>
</body>
</html>
