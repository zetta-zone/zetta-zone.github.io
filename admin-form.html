<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор карточек товара</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f4f7f6;
      padding: 40px 20px;
      color: #333;
    }
    .form-container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    h2 { margin-top: 0; color: #222; }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    textarea { height: 100px; resize: vertical; }
    button {
      background: #007bff;
      color: #fff;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    button:hover { background: #0056b3; }
    .result-box {
      margin-top: 30px;
      display: none;
    }
    textarea.code-output {
      font-family: monospace;
      background: #272822;
      color: #f8f8f2;
      padding: 15px;
      height: 180px;
    }
    .copy-btn {
      background: #28a745;
      margin-top: 10px;
    }
    .copy-btn:hover { background: #218838; }
  </style>
</head>
<body>

<div class="form-container">
  <h2>Добавление нового товара</h2>
  
  <div class="form-group">
    <label for="prod-title">Название товара</label>
    <input type="text" id="prod-title" placeholder="Например: Смартфон Apple iPhone 15">
  </div>

  <div class="form-group">
    <label for="prod-img">Ссылка на картинку (URL)</label>
    <input type="text" id="prod-img" placeholder="Например: images/phone.jpg">
  </div>

  <div class="form-group">
    <label for="prod-desc">Описание товара</label>
    <textarea id="prod-desc" placeholder="Краткое описание характеристик и преимуществ..."></textarea>
  </div>

  <div class="form-group">
    <label for="prod-price">Цена</label>
    <input type="text" id="prod-price" placeholder="Например: 85 000 ₽">
  </div>

  <button onclick="generateCard()">Сгенерировать HTML-код</button>

  <!-- Блок с результатом -->
  <div class="result-box" id="resultBox">
    <label>Скопируйте этот код и вставьте в ваш index.html:</label>
    <textarea class="code-output" id="codeOutput" readonly></textarea>
    <button class="copy-btn" onclick="copyCode()">Скопировать код</button>
  </div>
</div>

<script>
function generateCard() {
  // Получаем данные из полей
  const title = document.getElementById('prod-title').value || 'Название товара';
  const img = document.getElementById('prod-img').value || 'images/placeholder.jpg';
  const desc = document.getElementById('prod-desc').value || 'Описание товара';
  const price = document.getElementById('prod-price').value || '0 ₽';

  // Генерируем HTML-код (Сюда вы можете подставить структуру СВОЕЙ карточки)
  const htmlCode = `<!-- Карточка: ${title} -->
<div class="product-card">
  <div class="product-image">
    <img src="${img}" alt="${title}">
  </div>
  <div class="product-info">
    <h3 class="product-title">${title}</h3>
    <p class="product-description">${desc}</p>
    <div class="product-footer">
      <span class="product-price">${price}</span>
      <button class="product-button">Купить</button>
    </div>
  </div>
</div>`;

  // Выводим результат
  document.getElementById('codeOutput').value = htmlCode;
  document.getElementById('resultBox').style.display = 'block';
}

function copyCode() {
  const copyText = document.getElementById('codeOutput');
  copyText.select();
  document.execCommand('copy');
  alert('Код скопирован в буфер обмена!');
}
</script>

</body>
</html>
